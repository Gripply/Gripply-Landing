[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/features"
  to = "/features.html"
  status = 200

[[redirects]]
  from = "/faq"
  to = "/faq.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/complaints"
  to = "/complaints.html"
  status = 200

# The waitlist function's source sits inside the published repo root, so answer its path with the 404 page
# (force = true: the file exists). The function itself runs at /.netlify/functions/subscribe, untouched by this.
# Netlify matches rules case-sensitively but serves files whatever the case, so this covers the exact path only;
# the source is public on GitHub anyway and holds no secrets. The README lives in .github/, which Netlify does not publish.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The pages reference these with a ?v=N query — bump it when they change.
[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/site.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/consent.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The hero photographs: index.html references them with ?v=N too — bump it when a photo is replaced.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The share image: the pages reference it with ?v=N too (bump it when the image changes),
# but scrapers may fetch it bare — short-lived cache instead.
[[headers]]
  for = "/og-image.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# The icons: fixed URLs with no ?v= (Google wants a stable favicon URL), so a week's cache, not immutable:
# a replaced icon reaches returning visitors within a week.
[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/icon-192.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/icon-512.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# The web app manifest, with its registered media type, and a day's cache.
[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=86400"

# The site summary for AI tools (llmstxt.org): UTF-8 plain text.
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
